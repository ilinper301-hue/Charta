<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1B4D3E">
<title>Charta</title>
<link rel="manifest" href="../manifest.webmanifest">
<link rel="icon" type="image/png" href="../iconos/favicon.png">
<link rel="apple-touch-icon" href="../iconos/apple-touch-icon.png">
<link rel="stylesheet" href="estilos.css">
</head>
<body>
<header class="barra"><h1>Charta</h1><span class="sub">Fichas educativas</span></header>
<main>
  <section class="tarjeta" id="guardadas" hidden>
    <div class="pestanas"><button id="pFav" class="activa">★ Favoritas</button><button id="pRec">Recientes</button></div>
    <ul id="listaGuardadas" class="lista-g"></ul>
  </section>
  <section class="tarjeta">
    <h2>Actividades</h2>
    <div id="acts"></div>
    <div class="botones"><button id="anadir">+ Segunda actividad</button><button id="irPrevia">Vista previa ↓</button></div>
  </section>
  <section class="tarjeta">
    <h2>Alumnos e impresión</h2>
    <label>Alumnos (escríbelos o pégalos: uno por línea, con comas o desde una hoja de cálculo)
      <textarea id="alumnos" rows="4" placeholder="Ana&#10;Luis"></textarea></label>
    <p id="cuenta" class="info">Sin alumnos: la ficha sale con la línea del nombre en blanco.</p>
    <label id="filaCopias">Copias <input id="copias" type="number" min="1" max="30" value="1" inputmode="numeric"></label>
    <label>Fichas <select id="variaciones">
      <option value="iguales">Todas iguales</option>
      <option value="2">Dos variantes (A y B), alternas</option>
      <option value="3">Tres variantes (A, B y C), alternas</option>
      <option value="distintas">Una distinta para cada ficha</option></select></label>
    <label class="check"><input type="checkbox" id="bn"> Blanco y negro (ahorro de tinta)</label>
    <label>Título (opcional) <input id="titulo" placeholder="Automático"></label>
    <div class="botones">
      <button id="imprimir" class="primario">Imprimir / Guardar PDF</button>
      <button id="variante">Otra variante</button>
      <button id="favorito">☆ Favorita</button>
      <button id="versol">Ver soluciones</button>
    </div>
    <p id="error" class="error" hidden></p>
    <p id="info" class="info"></p>
  </section>
  <div class="lado">
  <section id="soluciones" class="tarjeta solucionario" hidden>
    <h2>Soluciones <small>(solo en pantalla)</small></h2>
    <div id="hojasSol" class="hojas"></div>
  </section>
  <section class="tarjeta previa" id="previa">
    <h2>Vista previa</h2>
    <div id="hojas" class="hojas"></div>
  </section>
  </div>
</main>
<div id="aviso" class="aviso" hidden>Hay una versión nueva de Charta. <button id="recargar">Actualizar</button></div>
<div id="impresion" class="impresion"></div>
<script type="module" src="app.js"></script>
</body>
</html>
