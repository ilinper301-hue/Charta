/* Sistema de diseño (en la línea de Tabula: fondo crema, serif en títulos, un único acento: el verde de Charta) */
:root {
  --fondo: #FAF9F5; --superficie: #FFFFFF; --superficie-2: #F4F3EE; --hover: #EEEDE6;
  --borde: #E8E6DD; --borde-fuerte: #D9D7CC;
  --texto: #141413; --texto-2: #3D3C38; --apagado: #66655F;
  --primario: #1B4D3E; --primario-osc: #133A2E; --acento-texto: #1B5E4A; --acento-suave: #EAF3EE; --acento-linea: #CFE3D8;
  --sobre-acento: #FFFFFF; --error: #A63A2A;
  --serif: "Iowan Old Style", "Source Serif 4", Georgia, "Noto Serif", serif;
  --sans: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r-sm: 8px; --r-md: 12px; --r-lg: 18px;
  --sombra-sm: 0 1px 2px rgba(20, 20, 19, .05); --sombra-md: 0 6px 24px rgba(20, 20, 19, .08); --sombra-papel: 0 2px 10px rgba(20, 20, 19, .12);
  color-scheme: light;
}
:root[data-tema="oscuro"] {
  --fondo: #1A1D1B; --superficie: #242826; --superficie-2: #202321; --hover: #2E3330;
  --borde: #343935; --borde-fuerte: #434944;
  --texto: #EEF1ED; --texto-2: #D3D8D3; --apagado: #9EA6A0;
  --primario: #2E7A5C; --primario-osc: #3A8D6C; --acento-texto: #8FD0B2; --acento-suave: #243A30; --acento-linea: #33564A;
  --error: #E58A78;
  --sombra-sm: 0 1px 2px rgba(0, 0, 0, .3); --sombra-md: 0 6px 24px rgba(0, 0, 0, .35); --sombra-papel: 0 2px 14px rgba(0, 0, 0, .5);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body { margin: 0; font-family: var(--sans); font-size: 15px; line-height: 1.45; background: var(--fondo); color: var(--texto);
  -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2px solid var(--primario); outline-offset: 2px; }

/* Cabecera: logotipo (icono + nombre) y botón de tema */
.barra { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 10px 16px; background: color-mix(in srgb, var(--fondo) 88%, transparent); backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px); border-bottom: 1px solid var(--borde); }
.marca { display: flex; align-items: center; gap: 10px; min-width: 0; }
.logo { width: 34px; height: 34px; border-radius: 22%; flex-shrink: 0; box-shadow: 0 1px 2px rgba(20, 20, 19, .15); }
.barra h1 { margin: 0; font-family: var(--sans); font-weight: 700; font-size: 1.3rem; letter-spacing: -.035em; color: var(--texto); }
.sub { color: var(--apagado); font-size: .88rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tema { display: grid; place-items: center; width: 40px; height: 40px; padding: 0; border-radius: 999px; border: 1px solid var(--borde);
  background: var(--superficie); color: var(--texto-2); }
.tema:hover { background: var(--hover); }
.acciones { display: flex; align-items: center; gap: 8px; }
.cuenta { height: 40px; padding: 0 14px; border-radius: 999px; font-size: .88rem; max-width: 46vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

main { max-width: 760px; margin: 0 auto; padding: 16px; display: grid; gap: 16px; }
.tarjeta { background: var(--superficie); border: 1px solid var(--borde); border-radius: var(--r-lg); padding: 18px; display: grid; gap: 12px;
  box-shadow: var(--sombra-sm); }
h2 { margin: 0; font-family: var(--serif); font-weight: 600; font-size: 1.3rem; letter-spacing: -.01em; color: var(--texto); }
h2 small { font-family: var(--sans); font-weight: 400; color: var(--apagado); font-size: .8rem; letter-spacing: 0; }

.act { border: 1px solid var(--borde); background: var(--superficie-2); border-radius: var(--r-md); padding: 12px; display: grid; gap: 10px; }
.act-cab { display: flex; justify-content: space-between; align-items: center; font-weight: 600; color: var(--acento-texto); font-size: .9rem; }
.act-cab button { padding: 4px 10px; font-size: .85rem; }
.act-herr { display: flex; gap: 6px; }
.act-herr:empty { display: none; }

label { display: grid; gap: 5px; font-size: .88rem; color: var(--apagado); }
label.check { display: flex; align-items: center; gap: 8px; color: var(--texto-2); }
input[type="checkbox"] { accent-color: var(--primario); width: 18px; height: 18px; }
select, input, textarea { font: inherit; padding: 10px 12px; border: 1px solid var(--borde-fuerte); border-radius: var(--r-sm);
  background: var(--superficie); color: var(--texto); }
select:focus, input:focus, textarea:focus { outline: none; border-color: var(--primario); box-shadow: 0 0 0 3px var(--acento-suave); }
textarea { resize: vertical; }
::placeholder { color: var(--apagado); opacity: .7; }

.botones { display: flex; gap: 8px; flex-wrap: wrap; }
button { font: inherit; font-weight: 500; padding: 10px 16px; border-radius: 10px; border: 1px solid var(--borde-fuerte);
  background: var(--superficie); color: var(--texto-2); cursor: pointer; transition: background .15s, border-color .15s; }
button:hover:not(:disabled) { background: var(--hover); }
button:active:not(:disabled) { background: var(--acento-suave); border-color: var(--acento-linea); color: var(--acento-texto); }
button.primario { background: var(--primario); border-color: var(--primario); color: var(--sobre-acento); }
button.primario:hover, button.primario:active { background: var(--primario-osc); border-color: var(--primario-osc); color: var(--sobre-acento); }
button:disabled { cursor: default; }

.error { color: var(--error); margin: 0; }
.info { color: var(--apagado); margin: 0; font-size: .85rem; }
.hojas { display: grid; gap: 14px; }
/* El papel es siempre blanco (también en modo oscuro): es como saldrá impreso. */
.hoja { background: #fff; border-radius: 4px; overflow: hidden; box-shadow: var(--sombra-papel); }
.hoja svg { display: block; width: 100%; height: auto; }
.hoja-etq { font-size: .8rem; color: var(--apagado); margin: 0 0 4px; }
.previa { background: var(--superficie-2); }
.impresion { display: none; }

@page { size: A4 portrait; margin: 0; }
@media print {
  body { background: #fff; }
  .barra, main, .aviso { display: none !important; }
  .impresion { display: block; }
  .impresion .pag { width: 210mm; height: 297mm; overflow: hidden; break-after: page; page-break-after: always; }
  .impresion .pag:last-child { break-after: auto; page-break-after: auto; }
  .impresion svg { display: block; width: 210mm; height: 297mm; }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}

/* Paso 4.1 · actividad elegida y selector curso → materia → bloque → modelo */
.elegido { display: grid; grid-template-columns: 84px 1fr auto; gap: 12px; align-items: center; }
.elegido-txt { display: grid; gap: 2px; }
.elegido-txt strong { font-weight: 600; }
.elegido-txt small, .sel-tarjeta small { color: var(--apagado); font-size: .8rem; line-height: 1.3; }
.mini { background: #fff; border: 1px solid var(--borde); border-radius: var(--r-sm); aspect-ratio: 4 / 3; overflow: hidden; display: grid; place-items: center; padding: 4px; }
.mini svg { width: 100%; height: 100%; display: block; }
.ops { display: grid; gap: 10px; }
body.con-selector { overflow: hidden; }
.selector { position: fixed; inset: 0; z-index: 10; background: var(--fondo); display: flex; flex-direction: column; }
.sel-cab { display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-bottom: 1px solid var(--borde); background: var(--fondo); }
.sel-cab h2 { flex: 1; font-size: 1.2rem; }
.sel-cab button { background: transparent; border: 0; color: var(--texto-2); font-size: 1.25rem; padding: 6px 12px; border-radius: 999px; }
.migas { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; padding: 10px 14px 0; color: var(--apagado); font-size: .85rem; }
.migas:empty { display: none; }
.migas button { border: 1px solid var(--acento-linea); background: var(--acento-suave); color: var(--acento-texto); padding: 4px 12px; border-radius: 999px; font-size: .85rem; }
.rejilla { flex: 1; overflow-y: auto; padding: 14px; display: grid; gap: 12px; align-content: start;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); max-width: 1000px; width: 100%; margin: 0 auto; }
.rejilla.modelos { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.sel-tarjeta { display: grid; gap: 4px; text-align: left; align-content: start; background: var(--superficie); color: var(--texto);
  border: 1px solid var(--borde); border-radius: var(--r-md); padding: 14px 16px; box-shadow: var(--sombra-sm); }
.sel-tarjeta strong { font-family: var(--serif); font-weight: 600; font-size: 1.05rem; color: var(--texto); }
.sel-tarjeta.modelo { padding: 8px; }
.sel-tarjeta.modelo strong { font-family: var(--sans); font-size: .92rem; }
.sel-tarjeta .meta { color: var(--primario); letter-spacing: .06em; font-weight: 600; }
.sel-tarjeta.actual { border: 2px solid var(--primario); }
.sel-tarjeta:disabled { opacity: .45; }
.sel-tarjeta:hover:not(:disabled) { border-color: var(--acento-linea); background: var(--superficie); }
.sel-tarjeta:active:not(:disabled) { background: var(--acento-suave); color: var(--texto); }

/* Paso 4.4 · favoritas y recientes */
.pestanas { display: flex; gap: 6px; flex-wrap: wrap; }
.pestanas button { padding: 6px 14px; border-radius: 999px; font-size: .88rem; }
.pestanas button.activa { background: var(--acento-suave); color: var(--acento-texto); border-color: var(--acento-linea); }
.lista-g { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; max-height: 260px; overflow-y: auto; }
.lista-g li { display: flex; gap: 6px; }
.g-abrir { flex: 1; display: grid; gap: 2px; text-align: left; color: var(--texto); background: var(--superficie-2); border-color: var(--borde); }
.g-abrir strong { font-weight: 600; }
.g-abrir small { color: var(--apagado); font-size: .8rem; }
.g-quitar { color: var(--apagado); padding: 6px 12px; }
#favorito.on { background: var(--acento-suave); color: var(--acento-texto); border-color: var(--acento-linea); }

/* Paso 4.5 · aviso de versión nueva y modo tableta (dos columnas: opciones a la izquierda, vista previa fija a la derecha) */
.lado { display: grid; gap: 16px; min-width: 0; }
.aviso { position: fixed; left: 50%; bottom: 16px; transform: translateX(-50%); z-index: 20; background: var(--texto); color: var(--fondo);
  padding: 10px 12px 10px 16px; border-radius: var(--r-md); display: flex; gap: 12px; align-items: center; box-shadow: var(--sombra-md); font-size: .9rem; }
.aviso button { padding: 6px 12px; }
@media (min-width: 900px) {
  .barra { padding-left: max(18px, calc((100% - 1280px) / 2 + 18px)); padding-right: max(18px, calc((100% - 1280px) / 2 + 18px)); }
  main { max-width: 1280px; grid-template-columns: minmax(360px, 440px) minmax(0, 1fr); align-items: start; }
  main > .tarjeta { grid-column: 1; }
  .lado { grid-column: 2; grid-row: 1 / span 4; position: sticky; top: 72px; max-height: calc(100vh - 88px); overflow-y: auto; border-radius: var(--r-lg); }
  #irPrevia { display: none; }
}
@media (min-width: 1200px) { .lado .hojas { grid-template-columns: repeat(auto-fill, minmax(420px, 1fr)); } }
@media (max-width: 420px) { .sub { display: none; } }
</style>
</head>
<body>
<header class="barra"><div class="marca"><svg class="logo" viewBox="0 0 512 512" aria-hidden="true"><rect width="512" height="512" rx="112" fill="#1B4D3E"/><g transform="translate(70 404) rotate(-16)"><rect x="0" y="-232" width="110" height="232" rx="26" fill="#6DB592"/></g><g transform="translate(108 392) rotate(-9)"><rect x="0" y="-254" width="110" height="254" rx="26" fill="#CFE8DA"/></g><g transform="translate(146 376) rotate(-3)"><rect x="0" y="-286" width="110" height="286" rx="28" fill="#9FD3B8"/></g><path d="M409.7 191.3A112 112 0 1 0 409.7 326.7" fill="none" stroke="#1B4D3E" stroke-width="100" stroke-linecap="round"/><path d="M409.7 191.3A112 112 0 1 0 409.7 326.7" fill="none" stroke="#FAF9F5" stroke-width="80" stroke-linecap="round"/></svg><h1>Charta</h1><span class="sub">Fichas educativas</span></div><div class="acciones"><button id="cuentaNube" class="cuenta">☁ Entrar</button><button id="tema" class="tema"></button></div></header>
<main>
  <section class="tarjeta" id="guardadas" hidden>
    <div class="pestanas"><button id="pFav" class="activa">★ Favoritas</button><button id="pRec">Recientes</button><button id="pNube" hidden>☁ En la nube</button></div>
    <ul id="listaGuardadas" class="lista-g"></ul>
  </section>
  <section class="tarjeta">
    <h2>Actividades</h2>
    <div id="acts"></div>
    <div class="botones"><button id="anadir">+ Segunda actividad</button><button id="irPrevia">Vista previa ↓</button></div>
  </section>
  <section class="tarjeta">
    <h2>Alumnos e impresión</h2>
    <label id="filaTabula" hidden>Grupo de Tabula <select id="grupoTabula"><option value="">— Escribir o pegar la lista —</option></select></label>
    <label>Alumnos (escríbelos o pégalos: uno por línea, con comas o desde una hoja de cálculo)
      <textarea id="alumnos" rows="4" placeholder="Ana&#10;Luis"></textarea></label>
    <p id="cuenta" class="info">Sin alumnos: la ficha sale con la línea del nombre en blanco.</p>
    <label id="filaCopias">Copias <input id="copias" type="number" min="1" max="30" value="1" inputmode="numeric"></label>
    <label>Fichas <select id="variaciones">
      <option value="iguales">Todas iguales</option>
      <option value="2">Dos variantes (A y B), alternas</option>
      <option value="3">Tres variantes (A, B y C), alternas</option>
      <option value="distintas">Una distinta para cada ficha</option></select></label>
    <label class="check"><input type="checkbox" id="bn"> Blanco y negro (ahorro de tinta)</label>
    <label class="check"><input type="checkbox" id="grande"> Letra grande (cabecera y enunciado)</label>
    <label class="check"><input type="checkbox" id="facil"> Lectura fácil (letra grande y una frase por línea)</label>
    <label>Título (opcional) <input id="titulo" placeholder="Automático"></label>
    <div class="botones">
      <button id="imprimir" class="primario">Imprimir / Guardar PDF</button>
      <button id="variante">Otra variante</button>
      <button id="favorito">☆ Favorita</button>
      <button id="guardarNube">☁ Guardar en la nube</button>
      <button id="aTabula" hidden title="Añadirla a Documentos de Tabula (sin nombres de alumnos)">↗ Enviar a Tabula</button>
      <button id="aFori" title="Proyectar en la pizarra Fori: un ejercicio por página y la solución paso a paso">▶ Proyectar en Fori</button>
      <button id="versol">Ver soluciones</button>
    </div>
    <p id="estadoNube" class="info" hidden></p>
    <p id="error" class="error" hidden></p>
    <p id="info" class="info"></p>
  </section>
  <div class="lado">
  <section id="soluciones" class="tarjeta solucionario" hidden>
    <h2>Soluciones <small>(solo en pantalla)</small></h2>
    <div id="hojasSol" class="hojas"></div>
  </section>
  <section class="tarjeta previa" id="previa">
    <h2>Vista previa</h2>
    <div id="hojas" class="hojas"></div>
  </section>
  </div>
</main>
<div id="aviso" class="aviso" hidden>Hay una versión nueva de Charta. <button id="recargar">Actualizar</button></div>
<div id="impresion" class="impresion"></div>
<script>
(() => {
"use strict";
const __mods = {
"app.js": (__exp) => {
// Charta · app. 4.1: selector y opciones · 4.2: compositor · 4.3: alumnos y variantes · 4.4: favoritas y recientes · 4.5: PWA y tableta · 5.1: nube · 5.2: Tabula · 5.3: Fori.
const { CATALOGO } = __req("nucleo/catalogo.js");
const { generar, porDefecto, modelo, metadatosDe } = __req("nucleo/ficha.js");
const { erroresFicha, letraVariante, paginasVariante } = __req("nucleo/lector.js");
const { listaTipos } = __req("tipos/index.js");
const { hoja, hojas, estiloLectura, PALETA } = __req("render/hoja.js");
const { hayTipo } = __req("nucleo/tipos.js");
const { miniatura } = __req("ui/navegacion.js");
const { abrirSelector } = __req("ui/selector.js");
const { crearGuardadas } = __req("ui/guardadas.js");
const { leerAlumnos, numVariantes, MAX_ALUMNOS } = __req("ui/alumnos.js");
const { registrarSW } = __req("pwa/registro.js");
const { iniciarTema } = __req("ui/tema.js");
const { crearNube } = __req("nube/nube.js");
const { leerEntrada, leerTabula, gruposDeTabula, urlVolver } = __req("ui/tabula.js");
const { paqueteFori, URL_FORI, CLAVE_FORI } = __req("fori/diapositivas.js");
globalThis.Charta = { generar, modelo, erroresFicha, listaTipos, hojas, CATALOGO };

const $ = (id) => document.getElementById(id);
function el(tag, props = {}, ...hijos) { const e = Object.assign(document.createElement(tag), props); e.append(...hijos); return e; }

// Paso 5.3 · Fori: caja de cada ejercicio (getBBox en un SVG oculto) y fuentes incrustadas para las diapositivas.
function cajasEjercicios(zona) {
  const s = document.createElementNS("http://www.w3.org/2000/svg", "svg");
  s.setAttribute("style", "position:absolute;left:-10000px;top:0;width:10px;height:10px;visibility:hidden");
  s.innerHTML = zona.svg; document.body.append(s);
  const out = {};
  for (const g of s.querySelectorAll("g.ej")) { const b = g.getBBox(); out[g.getAttribute("data-ej")] = { x: b.x, y: b.y, w: b.width, h: b.height }; }
  s.remove();
  return out;
}
const cssFuentes = () => [...document.styleSheets].flatMap((h) => { try { return [...h.cssRules]; } catch { return []; } })
  .filter((r) => r instanceof CSSFontFaceRule && /data:font/.test(r.cssText)).map((r) => r.cssText).join("");

/** Editor de una actividad: modelo elegido (con el selector) + sus opciones (desde MODELOS). */
function editorActividad(id, { tamano, alCambiar }) {
  const caja = el("div", { className: "act" });
  const ops = el("div", { className: "ops" });
  const mini = el("div", { className: "mini" }), nombre = el("strong"), desc = el("small");
  const cambiar = el("button", { textContent: "Cambiar" });
  const elegido = el("div", { className: "elegido" }, mini, el("div", { className: "elegido-txt" }, nombre, desc), cambiar);
  const etq = el("span"), herr = el("div", { className: "act-herr" });
  const cab = el("div", { className: "act-cab" }, etq, herr);
  caja.append(cab, elegido, ops);
  const ed = { caja, id, leer, poner, refrescar: () => pintarOpciones(leer().params),
    /** El compositor pone el número y los botones (subir, bajar, quitar). */
    cabecera(num, botones) { etq.textContent = `Actividad ${num}`; herr.replaceChildren(...botones); } };

  function poner(nuevo, params) {
    ed.id = nuevo;
    const m = modelo(nuevo), [fondo, borde] = PALETA[m.color] ?? PALETA.verde;
    nombre.textContent = m.nombre; desc.textContent = m.descripcion;
    mini.style.background = fondo; mini.style.borderColor = borde;
    try { mini.innerHTML = miniatura(nuevo); } catch { mini.textContent = ""; }
    pintarOpciones(params);
  }
  cambiar.onclick = () => abrirSelector({ actual: ed.id, tamano: tamano(), alElegir: (n) => { poner(n); alCambiar(ed); } });

  // prev: valores que ya había (se conservan al pasar de página completa a media y al revés).
  function pintarOpciones(prev = {}) {
    const m = modelo(ed.id), def = { ...porDefecto(m.id), ...prev }, t = tamano();
    ops.replaceChildren();
    const campo = (etq, control) => ops.append(el("label", {}, etq, control));
    if (m.rangos.length > 1) {
      const s = el("select"); s.dataset.op = "rango";
      for (const r of m.rangos) s.add(new Option(`Hasta el ${r}`, r, false, r === def.rango));
      campo("Números", s);
    }
    for (const o of m.opciones) {
      let c;
      if (o.tipo === "opcion") {
        c = el("select");
        o.valores.forEach((v, i) => {
          const op = new Option(v.etiqueta, i, false, v.valor === def[o.id]);
          if (v.tamanos && !v.tamanos.includes(t)) { op.disabled = true; op.text += " (solo página completa)"; op.selected = false; }
          c.add(op);
        });
        if (c.selectedOptions[0]?.disabled !== false) c.value = [...c.options].find((x) => !x.disabled)?.value ?? c.value;
      } else if (o.tipo === "si_no") {
        c = el("input", { type: "checkbox", checked: !!def[o.id] });
      } else c = el("input", { type: "number", min: o.min, max: o.max, value: def[o.id] ?? "", placeholder: "Automático", inputMode: "numeric" });
      c.dataset.op = o.id;
      if (o.tipo === "si_no") ops.append(el("label", { className: "check" }, c, " " + o.etiqueta)); else campo(o.etiqueta, c);
    }
  }
  function leer() {
    const m = modelo(ed.id), p = {};
    for (const c of ops.querySelectorAll("[data-op]")) {
      const k = c.dataset.op, o = m.opciones.find((x) => x.id === k);
      if (k === "rango") p.rango = +c.value;
      else if (o.tipo === "opcion") p[k] = o.valores[+c.value].valor;
      else if (o.tipo === "si_no") p[k] = c.checked;
      else p[k] = c.value === "" ? null : +c.value;
    }
    return { tipo: ed.id, params: p };
  }
  poner(id);
  return ed;
}

const ULTIMO = "charta:ultimoModelo";
function guardarUltimo(id) { try { localStorage.setItem(ULTIMO, id); } catch {} }
function leerUltimo() { try { const id = localStorage.getItem(ULTIMO); return id && hayTipo(id) ? id : null; } catch { return null; } }

function iniciar() {
  let semilla = 1, ficha = null, paginas = [];
  const editores = [];
  const nombres = () => leerAlumnos($("alumnos").value).slice(0, MAX_ALUMNOS);
  const copias = () => Math.max(1, Math.min(MAX_ALUMNOS, parseInt($("copias").value, 10) || 1));
  function contar() {
    const todos = leerAlumnos($("alumnos").value), n = Math.min(todos.length, MAX_ALUMNOS);
    $("filaCopias").hidden = n > 0;
    $("cuenta").textContent = !n ? "Sin alumnos: la ficha sale con la línea del nombre en blanco."
      : `${n} alumno${n > 1 ? "s" : ""}: una ficha con su nombre para cada uno.` + (todos.length > MAX_ALUMNOS ? ` (máximo ${MAX_ALUMNOS}; sobran ${todos.length - MAX_ALUMNOS})` : "");
  }

  const tamano = () => (editores.length > 1 ? "media" : "completa");
  // Compositor (paso 4.2): añadir, ordenar y quitar actividades (1 o 2 por hoja).
  const boton = (texto, titulo, f) => { const b = el("button", { textContent: texto, title: titulo }); b.onclick = f; return b; };
  function recolocar() {
    $("acts").replaceChildren(...editores.map((e) => e.caja));
    editores.forEach((e, i) => e.cabecera(i + 1, [
      ...(editores.length > 1 ? [i ? boton("↑ Subir", "Pasarla a actividad 1", () => mover(i, -1)) : boton("↓ Bajar", "Pasarla a actividad 2", () => mover(i, 1))] : []),
      ...(editores.length > 1 ? [boton("Quitar", "Quitar esta actividad", () => quitar(i))] : []),
    ]));
    $("anadir").hidden = editores.length >= 2;
    for (const e of editores) e.refrescar();
  }
  function mover(i, d) { [editores[i], editores[i + d]] = [editores[i + d], editores[i]]; recolocar(); pintar(); }
  function quitar(i) { editores.splice(i, 1); recolocar(); pintar(); }
  function cambiado(e) { if (editores[0] === e) guardarUltimo(e.id); pintar(); }
  function nuevoEditor(id) { editores.push(editorActividad(id, { tamano, alCambiar: cambiado })); recolocar(); }

  function pintar() {
    $("error").hidden = true;
    queueMicrotask(() => marcarFavorito());
    try {
      contar();
      const ns = nombres(), total = ns.length || copias();
      const acts = editores.map((e) => e.leer());
      ficha = generar({
        actividades: acts,
        metadatos: metadatosDe(acts.map((a) => a.tipo)),
        titulo: $("titulo").value.trim() || undefined,
        variantes: numVariantes($("variaciones").value, total),
        presentacion: { color: !$("bn").checked, ...($("grande").checked && { letraGrande: true }), ...($("facil").checked && { lecturaFacil: true }) },
      }, semilla);
      const bn = $("bn").checked;
      paginas = hojas(ficha, { nombres: ns, copias: total, bn });
      const etiqueta = (p) => (p.nombre || "Sin nombre") + (ficha.variantes > 1 ? ` · variante ${letraVariante(p.variante)}` : "");
      $("hojas").replaceChildren(...paginas.map((p) => el("div", {}, el("p", { className: "hoja-etq", textContent: etiqueta(p) }),
        Object.assign(el("div", { className: "hoja" }), { innerHTML: p.svg }))));
      // Solucionario: una hoja resuelta por variante (sin nombres).
      const sol = Array.from({ length: ficha.variantes }, (_, v) => ({ svg: hoja(paginasVariante(ficha, v)[0], { titulo: ficha.titulo, bn, modo: "solucion", uid: `s${v}`, ...estiloLectura(ficha) }) }));
      $("hojasSol").replaceChildren(...sol.map((p, v) => el("div", {}, el("p", { className: "hoja-etq", textContent: ficha.variantes > 1 ? `Variante ${letraVariante(v)}` : "Soluciones" }),
        Object.assign(el("div", { className: "hoja" }), { innerHTML: p.svg }))));
      $("info").textContent = `${paginas.length} página${paginas.length > 1 ? "s" : ""}` +
        (ficha.variantes > 1 ? ` · variantes ${letraVariante(0)}–${letraVariante(ficha.variantes - 1)}` : "") + ` · ${ficha.titulo}`;
    } catch (e) { $("error").textContent = e.message; $("error").hidden = false; }
  }

  $("anadir").onclick = () => abrirSelector({ tamano: "media", actual: editores[0].id,
    alElegir: (id) => { nuevoEditor(id); pintar(); } });
  $("acts").addEventListener("change", pintar);
  for (const id of ["alumnos", "copias", "variaciones", "bn", "grande", "facil", "titulo"]) $(id).addEventListener("change", pintar);
  $("alumnos").addEventListener("input", contar);
  $("irPrevia").onclick = () => $("previa").scrollIntoView({ behavior: "smooth" });
  $("variante").onclick = () => { semilla++; pintar(); };
  $("versol").onclick = () => {
    const s = $("soluciones"); s.hidden = !s.hidden; $("versol").textContent = s.hidden ? "Ver soluciones" : "Ocultar soluciones";
    if (!s.hidden) s.scrollIntoView({ behavior: "smooth" });
  };

  // Paso 4.4 · favoritas (con su semilla: sale la misma ficha) y recientes (al imprimir). Sin nombres de alumnos.
  const almacen = (() => { try { return localStorage; } catch { return { getItem: () => null, setItem() {} }; } })();
  const guardadas = crearGuardadas(almacen);
  let pestana = "favoritos";
  const composicion = () => ({ actividades: editores.map((e) => e.leer()), semilla, titulo: $("titulo").value.trim(),
    variaciones: $("variaciones").value, bn: $("bn").checked, grande: $("grande").checked, facil: $("facil").checked });
  function marcarFavorito() {
    try { const f = guardadas.esFavorito(composicion()); $("favorito").textContent = f ? "★ Favorita" : "☆ Favorita"; $("favorito").classList.toggle("on", f); } catch {}
  }
  function abrirGuardada(c) {
    editores.length = 0;
    for (const a of c.actividades) { const e = editorActividad(a.tipo, { tamano, alCambiar: cambiado }); editores.push(e); }
    recolocar();
    c.actividades.forEach((a, i) => editores[i].poner(a.tipo, a.params));
    semilla = c.semilla || 1; $("titulo").value = c.titulo || ""; $("variaciones").value = c.variaciones || "iguales"; $("bn").checked = !!c.bn; $("grande").checked = !!c.grande; $("facil").checked = !!c.facil;
    pintar(); $("acts").scrollIntoView({ behavior: "smooth" });
  }
  function pintarGuardadas() {
    const fav = guardadas.favoritos(), rec = guardadas.recientes(), dentro = nube.estado().estado === "dentro";
    const nubeLista = dentro ? enNube || [] : [];
    $("guardadas").hidden = !fav.length && !rec.length && !dentro;
    if (pestana === "nube" && !dentro) pestana = "favoritos";
    if (!fav.length && pestana === "favoritos") pestana = dentro ? "nube" : "recientes";
    if (!rec.length && pestana === "recientes") pestana = fav.length || !dentro ? "favoritos" : "nube";
    $("pFav").classList.toggle("activa", pestana === "favoritos"); $("pRec").classList.toggle("activa", pestana === "recientes");
    $("pNube").classList.toggle("activa", pestana === "nube"); $("pNube").hidden = !dentro;
    $("pFav").textContent = `★ Favoritas (${fav.length})`; $("pRec").textContent = `Recientes (${rec.length})`;
    $("pNube").textContent = enNube ? `☁ En la nube (${nubeLista.length})` : "☁ En la nube";
    if (pestana === "nube") return pintarNube(nubeLista);
    const lista = pestana === "favoritos" ? fav : rec;
    $("listaGuardadas").replaceChildren(...lista.map((c, i) => {
      const disp = c.actividades.every((a) => hayTipo(a.tipo));
      const abrir = el("button", { className: "g-abrir", disabled: !disp },
        el("strong", { textContent: c.nombre || "Ficha" }),

function crearNube({ cargar = cargarSdk, almacen = null, esperaMs = 4000 } = {}) {
  let fb = null, auth = null, db = null, arranque = null, cache = null;
  let estado = { estado: "apagada", usuario: null, error: null }; // apagada | cargando | fuera | dentro | error
  const oyentes = new Set();
  const poner = (p) => { estado = { ...estado, ...p }; oyentes.forEach((f) => { try { f({ ...estado }); } catch (e) { console.error(e); } }); };
  const bandera = (v) => { try { v ? almacen?.setItem(BANDERA, "1") : almacen?.removeItem?.(BANDERA); } catch {} };
  const uid = () => auth?.currentUser?.uid || null;
  const col = () => fb.fs.collection(db, ...RUTA_FICHAS);

  function iniciar() {
    if (arranque) return arranque;
    poner({ estado: "cargando", error: null });
    arranque = (async () => {
      try { fb = await cargar(); } catch { arranque = null; poner({ estado: "error", error: "No se pudo cargar Firebase. Revisa la conexión." }); throw new Error(estado.error); }
      const app = fb.app.initializeApp(firebaseConfig, "charta");
      try {
        db = fb.fs.initializeFirestore(app, { localCache: fb.fs.persistentLocalCache({ tabManager: fb.fs.persistentMultipleTabManager() }), ignoreUndefinedProperties: true });
      } catch { db = fb.fs.initializeFirestore(app, { localCache: fb.fs.memoryLocalCache(), ignoreUndefinedProperties: true }); }
      auth = fb.auth.getAuth(app); auth.languageCode = "es";
      try { await fb.auth.getRedirectResult(auth); } catch (e) { poner({ error: mensajeError(e) }); }
      await new Promise((listo) => {
        let primera = true;
        fb.auth.onAuthStateChanged(auth, (u) => {
          cache = null;
          if (u) { bandera(true); poner({ estado: "dentro", usuario: { nombre: u.displayName || "", correo: u.email || "", foto: u.photoURL || "" } }); }
          else poner({ estado: "fuera", usuario: null });
          if (primera) { primera = false; listo(); }
        });
      });
    })();
    return arranque;
  }

  return {
    estado: () => ({ ...estado }),
    alCambiar(f) { oyentes.add(f); return () => oyentes.delete(f); },
    /** ¿Hubo sesión en este dispositivo? Entonces conviene llamar a iniciar() al abrir la app. */
    recordada() { try { return almacen?.getItem(BANDERA) === "1"; } catch { return false; } },
    iniciar,

        const c = e.code || "";

        poner({ error: mensajeError(e) }); throw new Error(mensajeError(e));

    },
    async salir() {
      if (!auth) return;
      bandera(false); cache = null;
      await fb.auth.signOut(auth);
    },
    /** Lista de fichas del docente, la más nueva primero (sin índice compuesto: se ordena aquí). */
    async listar() {
      await iniciar();
      const u = uid(); if (!u) return [];
      try {
        const r = await fb.fs.getDocs(fb.fs.query(col(), fb.fs.where("autor", "==", u), fb.fs.limit(300)));
        cache = r.docs.map((d) => deDocumento(d.id, d.data())).sort((a, b) => (a.creada < b.creada ? 1 : a.creada > b.creada ? -1 : 0));

      } catch (e) { throw new Error(mensajeError(e)); }
    },
    /** Guarda la ficha (sin nombres). Devuelve { id, repetida, pendiente }: pendiente = sin conexión, se subirá sola. */

      let error = null;

    },
    async borrar(id) {
      await iniciar();
      try { await fb.fs.deleteDoc(fb.fs.doc(db, ...RUTA_FICHAS, id)); } catch (e) { throw new Error(mensajeError(e)); }

// Charta · azar con semilla (mulberry32). Mismas opciones + misma semilla = misma ficha.

/** Generador mulberry32: devuelve una función que da reales en [0, 1). */
function mulberry32(semilla) {
  let a = semilla >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/** Mezcla varios enteros en una semilla de 32 bits (para semillas derivadas: variante, actividad…). */
function mezclar(...ns) {
  let h = 0x811C9DC5;
  for (const n of ns) {
    h = Math.imul(h ^ (n >>> 0), 0x01000193) >>> 0;
    h = Math.imul(h ^ (h >>> 13), 0x5BD1E995) >>> 0;
    h ^= h >>> 15;
  }
  return h >>> 0;
}

/** Objeto de azar con utilidades. Todas son deterministas a partir de la semilla. */
function crearAzar(semilla) {
  const r = mulberry32(semilla);
  const azar = {
    semilla: semilla >>> 0,
    real: r,
    /** Entero entre a y b, ambos incluidos. */
    entero(a, b) { return a + Math.floor(r() * (b - a + 1)); },
    elegir(lista) {
      if (!lista.length) throw new Error("elegir(): lista vacía");
      return lista[Math.floor(r() * lista.length)];
    },
    /** Copia barajada (Fisher–Yates). */
    barajar(lista) {
      const l = lista.slice();
      for (let i = l.length - 1; i > 0; i--) {
        const j = Math.floor(r() * (i + 1));
        [l[i], l[j]] = [l[j], l[i]];
      }
      return l;
    },
    /** k elementos distintos de la lista. */
    muestra(lista, k) { return azar.barajar(lista).slice(0, k); },
    /** Azar hijo independiente (p. ej. uno por actividad). */
    hijo(...claves) { return crearAzar(mezclar(azar.semilla, ...claves)); },
  };
  return azar;
}

// ---------------------------------------------------------------- DEDOS

// ---------------------------------------------------------------- DADO

// ---------------------------------------------------------------- DOMINÓ

// ---------------------------------------------------------------- MARCO DE DIEZ
function frame(c, x, y, cs, fillN, r) {

  c.line(x, y + cs, x + w, y + cs, lw);

}

  const w = 5 * cs, h = 2 * cs, r = cs * 0.33;

  if (m === 1) frame(c, -w / 2, -h / 2, cs, f(0), r);

}

// ---------------------------------------------------------------- PALOTES
function r_palotes(c, n) {
  const lw = 2.2, groups = Array(Math.floor(n / 5)).fill(5);

  let rows, hh, sp, gap;
  if (groups.length <= 3) { rows = [groups]; hh = 42; sp = 10; gap = 16; }
  else { rows = [groups.slice(0, 3), groups.slice(3)]; hh = 28; sp = 9; gap = 14; }
  const nr = rows.length;
  rows.forEach((row, ri) => {
    const widths = row.map((g) => (Math.min(g, 4) - 1) * sp);
    const total = widths.reduce((a, b) => a + b, 0) + gap * (row.length - 1);
    let x = -total / 2;
    const yc = (nr - 1) * (hh + 10) / 2 - ri * (hh + 10);
    row.forEach((g, gi) => {
      const wd = widths[gi];
      for (let j = 0; j < Math.min(g, 4); j++) c.line(x + j * sp, yc - hh / 2, x + j * sp, yc + hh / 2, lw, "palote");
      if (g === 5) c.line(x - 5, yc - hh / 2 + 6, x + wd + 5, yc + hh / 2 - 6, lw, "tachado");

}

// ---------------------------------------------------------------- OBJETOS

    pts.push([x + rr * Math.cos(ang), y + rr * Math.sin(ang)]);

}
function shape(c, kind, x, y, r, lw) {
  if (kind === "c") c.circle(x, y, r, { lw, cls: "objeto" });
  else if (kind === "s") star(c, x, y, r * 1.2, lw);
  else if (kind === "q") c.rect(x - r * 0.9, y - r * 0.9, r * 1.8, r * 1.8, { lw, cls: "objeto" });
  else c.poly([[x, y + r * 1.05], [x - r * 1.05, y - r * 0.8], [x + r * 1.05, y - r * 0.8]], { lw, cls: "objeto" });
}

// ---------------------------------------------------------------- REGLETAS
