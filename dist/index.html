:root {
  --primario: #1B4D3E; --primario-osc: #133A2E; --fondo: #F4F7F5; --superficie: #FFFFFF;
  --suave: #E3EEE8; --texto: #1E2622; --texto-2: #5B6B63; --error: #A12A2A;
}
* { box-sizing: border-box; }
body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--fondo); color: var(--texto); }
.barra { background: var(--primario); color: #fff; padding: 14px 18px; display: flex; align-items: baseline; gap: 10px; }
.barra h1 { margin: 0; font-size: 1.35rem; letter-spacing: .02em; }
.sub { opacity: .8; font-size: .9rem; }
main { max-width: 760px; margin: 0 auto; padding: 14px; display: grid; gap: 14px; }
.tarjeta { background: var(--superficie); border: 1px solid var(--suave); border-radius: 12px; padding: 14px; display: grid; gap: 10px; }
.act { border: 1px solid var(--suave); border-radius: 10px; padding: 10px; display: grid; gap: 8px; }
.act-cab { display: flex; justify-content: space-between; align-items: center; font-weight: 600; color: var(--primario); }
.act-cab button { padding: 4px 10px; }
label { display: grid; gap: 4px; font-size: .9rem; color: var(--texto-2); }
label.check { display: flex; align-items: center; gap: 8px; }
select, input, textarea { font: inherit; padding: 9px 10px; border: 1px solid #cfdcd5; border-radius: 8px; background: #fff; color: var(--texto); }
.botones { display: flex; gap: 8px; flex-wrap: wrap; }
button { font: inherit; padding: 10px 16px; border-radius: 8px; border: 1px solid var(--primario); background: #fff; color: var(--primario); cursor: pointer; }
button.primario { background: var(--primario); color: #fff; }
button:active { background: var(--primario-osc); color: #fff; }
h2 { margin: 0; font-size: 1.1rem; color: var(--primario); }
h2 small { font-weight: 400; color: var(--texto-2); font-size: .8rem; }
.error { color: var(--error); margin: 0; }
.info { color: var(--texto-2); margin: 0; font-size: .85rem; }
.hojas { display: grid; gap: 12px; }
.hoja { background: #fff; box-shadow: 0 1px 4px rgba(0,0,0,.18); }
.hoja svg { display: block; width: 100%; height: auto; }
.hoja-etq { font-size: .8rem; color: var(--texto-2); margin: 0 0 4px; }
.impresion { display: none; }

@page { size: A4 portrait; margin: 0; }
@media print {
  body { background: #fff; }
  .barra, main { display: none !important; }
  .impresion { display: block; }
  .impresion .pag { width: 210mm; height: 297mm; overflow: hidden; break-after: page; page-break-after: always; }
  .impresion .pag:last-child { break-after: auto; page-break-after: auto; }
  .impresion svg { display: block; width: 210mm; height: 297mm; }
  * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
</style>
</head>
<body>
<header class="barra"><h1>Charta</h1><span class="sub">Fichas educativas</span></header>
<main>
  <section class="tarjeta">
    <h2>Actividades</h2>
    <div id="acts"></div>
    <div class="botones"><button id="anadir">+ Segunda actividad</button></div>
  </section>
  <section class="tarjeta">
    <h2>Alumnos e impresión</h2>
    <label>Alumnos (uno por línea; vacío = línea en blanco para el nombre)
      <textarea id="alumnos" rows="3" placeholder="Ana&#10;Luis"></textarea></label>
    <label>Fichas <select id="variaciones">
      <option value="iguales">Todas iguales</option>
      <option value="distintas">Una distinta para cada alumno</option></select></label>
    <label class="check"><input type="checkbox" id="bn"> Blanco y negro (ahorro de tinta)</label>
    <label>Título (opcional) <input id="titulo" placeholder="Automático"></label>
    <div class="botones">
      <button id="imprimir" class="primario">Imprimir / Guardar PDF</button>
      <button id="variante">Otra variante</button>
      <button id="versol">Ver soluciones</button>
    </div>
    <p id="error" class="error" hidden></p>
    <p id="info" class="info"></p>
  </section>
  <section id="soluciones" class="tarjeta solucionario" hidden>
    <h2>Soluciones <small>(solo en pantalla)</small></h2>
    <div id="hojasSol" class="hojas"></div>
  </section>
  <section class="tarjeta previa">
    <h2>Vista previa</h2>
    <div id="hojas" class="hojas"></div>
  </section>
</main>
<div id="impresion" class="impresion"></div>
<script>
(() => {
"use strict";
const __mods = {
"app.js": (__exp) => {
// Charta · app (corte vertical de la fase 2: paso 2.4). La interfaz completa llega en la fase 4.
const { CATALOGO } = __req("nucleo/catalogo.js");
const { generar, porDefecto, modelo } = __req("nucleo/ficha.js");
const { erroresFicha, letraVariante, paginasVariante } = __req("nucleo/lector.js");
const { listaTipos } = __req("tipos/index.js");
const { hoja, hojas } = __req("render/hoja.js");
globalThis.Charta = { generar, erroresFicha, listaTipos, hojas, CATALOGO };

const $ = (id) => document.getElementById(id);
function el(tag, props = {}, ...hijos) { const e = Object.assign(document.createElement(tag), props); e.append(...hijos); return e; }

/** Editor de una actividad: modelo + opciones (desde MODELOS). */
function editorActividad(num, alQuitar) {
  const caja = el("div", { className: "act" });
  const sel = el("select"), ops = el("div", { className: "ops" });
  const cab = el("div", { className: "act-cab" }, `Actividad ${num}`);
  if (alQuitar) { const b = el("button", { textContent: "Quitar" }); b.onclick = alQuitar; cab.append(b); }
  for (const id of listaTipos()) sel.add(new Option(modelo(id).nombre, id));
  caja.append(cab, el("label", {}, "Modelo", sel), ops);

  function pintarOpciones() {
    const m = modelo(sel.value), def = porDefecto(m.id);
    ops.replaceChildren();
    const campo = (etq, control) => ops.append(el("label", {}, etq, control));
    if (m.rangos.length > 1) {
      const s = el("select"); s.dataset.op = "rango";
      for (const r of m.rangos) s.add(new Option(`Hasta el ${r}`, r, false, r === def.rango));
      campo("Rango", s);
    }
    for (const o of m.opciones) {
      let c;
      if (o.tipo === "opcion") {
        c = el("select");
        o.valores.forEach((v, i) => c.add(new Option(v.etiqueta, i, false, v.valor === def[o.id])));
      } else if (o.tipo === "si_no") {
        c = el("input", { type: "checkbox", checked: !!def[o.id] });
      } else c = el("input", { type: "number", min: o.min, max: o.max, value: def[o.id] ?? "" });
      c.dataset.op = o.id;
      if (o.tipo === "si_no") ops.append(el("label", { className: "check" }, c, " " + o.etiqueta)); else campo(o.etiqueta, c);
    }
  }
  function leer() {
    const m = modelo(sel.value), p = {};
    for (const c of ops.querySelectorAll("[data-op]")) {
      const k = c.dataset.op, o = m.opciones.find((x) => x.id === k);
      if (k === "rango") p.rango = +c.value;
      else if (o.tipo === "opcion") p[k] = o.valores[+c.value].valor;
      else if (o.tipo === "si_no") p[k] = c.checked;
      else p[k] = c.value === "" ? null : +c.value;
    }
    return { tipo: sel.value, params: p };
  }
  sel.addEventListener("change", pintarOpciones);
  pintarOpciones();
  return { caja, leer, sel };
}

function iniciar() {
  let semilla = 1, ficha = null, paginas = [];
  const editores = [];
  const nombres = () => $("alumnos").value.split("\n").map((s) => s.trim()).filter(Boolean);

  function ponerEditores(n) {
    while (editores.length > n) editores.pop().caja.remove();
    while (editores.length < n) {
      const e = editorActividad(editores.length + 1, editores.length ? () => { ponerEditores(1); pintar(); } : null);
      if (editores.length) e.sel.value = editores[0].sel.value, e.sel.dispatchEvent(new Event("change"));
      editores.push(e); $("acts").append(e.caja);
    }
    $("anadir").hidden = n >= 2;
  }

  function pintar() {
    $("error").hidden = true;
    try {
      const ns = nombres(), distintas = $("variaciones").value === "distintas";
      ficha = generar({
        actividades: editores.map((e) => e.leer()),
        titulo: $("titulo").value.trim() || undefined,
        variantes: distintas ? Math.max(1, Math.min(30, ns.length)) : 1,
        presentacion: { color: !$("bn").checked },
      }, semilla);
      const bn = $("bn").checked;
      paginas = hojas(ficha, { nombres: ns, bn });
      const etiqueta = (p) => (p.nombre || "Sin nombre") + (ficha.variantes > 1 ? ` · variante ${letraVariante(p.variante)}` : "");
      $("hojas").replaceChildren(...paginas.map((p) => el("div", {}, el("p", { className: "hoja-etq", textContent: etiqueta(p) }),
        Object.assign(el("div", { className: "hoja" }), { innerHTML: p.svg }))));
      // Solucionario: una hoja resuelta por variante (sin nombres).
      const sol = Array.from({ length: ficha.variantes }, (_, v) => ({ svg: hoja(paginasVariante(ficha, v)[0], { titulo: ficha.titulo, bn, modo: "solucion", uid: `s${v}` }) }));
      $("hojasSol").replaceChildren(...sol.map((p, v) => el("div", {}, el("p", { className: "hoja-etq", textContent: ficha.variantes > 1 ? `Variante ${letraVariante(v)}` : "Soluciones" }),
        Object.assign(el("div", { className: "hoja" }), { innerHTML: p.svg }))));
      $("info").textContent = `${paginas.length} página${paginas.length > 1 ? "s" : ""} · ${ficha.titulo}`;
    } catch (e) { $("error").textContent = e.message; $("error").hidden = false; }
  }

  $("anadir").onclick = () => { ponerEditores(2); pintar(); };
  $("acts").addEventListener("change", pintar);
  for (const id of ["alumnos", "variaciones", "bn", "titulo"]) $(id).addEventListener("change", pintar);
  $("variante").onclick = () => { semilla++; pintar(); };
  $("versol").onclick = () => { const s = $("soluciones"); s.hidden = !s.hidden; $("versol").textContent = s.hidden ? "Ver soluciones" : "Ocultar soluciones"; };
  $("imprimir").onclick = () => {
    if (!paginas.length) return;
    // Solo las fichas del alumnado: el solucionario nunca va al papel.
    $("impresion").replaceChildren(...paginas.map((p) => Object.assign(el("div", { className: "pag" }), { innerHTML: p.svg })));
    const t = document.title; document.title = ficha.titulo;
    document.fonts.ready.then(() => { window.print(); document.title = t; });
  };
  ponerEditores(1); pintar();
}

if (typeof document !== "undefined") iniciar();

},
"nucleo/azar.js": (__exp) => {
// Charta · azar con semilla (mulberry32). Mismas opciones + misma semilla = misma ficha.

/** Generador mulberry32: devuelve una función que da reales en [0, 1). */
function mulberry32(semilla) {
  let a = semilla >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/** Mezcla varios enteros en una semilla de 32 bits (para semillas derivadas: variante, actividad…). */
function mezclar(...ns) {
  let h = 0x811C9DC5;
  for (const n of ns) {
    h = Math.imul(h ^ (n >>> 0), 0x01000193) >>> 0;
    h = Math.imul(h ^ (h >>> 13), 0x5BD1E995) >>> 0;
    h ^= h >>> 15;
  }
  return h >>> 0;
}

/** Objeto de azar con utilidades. Todas son deterministas a partir de la semilla. */
function crearAzar(semilla) {
  const r = mulberry32(semilla);
  const azar = {
    semilla: semilla >>> 0,
    real: r,
    /** Entero entre a y b, ambos incluidos. */
    entero(a, b) { return a + Math.floor(r() * (b - a + 1)); },
    elegir(lista) {
      if (!lista.length) throw new Error("elegir(): lista vacía");
      return lista[Math.floor(r() * lista.length)];
    },
    /** Copia barajada (Fisher–Yates). */
    barajar(lista) {
      const l = lista.slice();
      for (let i = l.length - 1; i > 0; i--) {
        const j = Math.floor(r() * (i + 1));
        [l[i], l[j]] = [l[j], l[i]];
      }
      return l;
    },
    /** k elementos distintos de la lista. */
    muestra(lista, k) { return azar.barajar(lista).slice(0, k); },
    /** Azar hijo independiente (p. ej. uno por actividad). */
    hijo(...claves) { return crearAzar(mezclar(azar.semilla, ...claves)); },
  };
  return azar;
}

Object.defineProperties(__exp, Object.getOwnPropertyDescriptors({ get mulberry32() { return mulberry32; }, get mezclar() { return mezclar; }, get crearAzar() { return crearAzar; } }));
},

"nucleo/ficha.js": (__exp) => {
// Charta · generar(opciones, semilla) → ficha JSON (ESQUEMA.md, schemaVersion 1).
// Port de modelos.validar()/por_defecto() y de pagina()/titulo_pagina() del motor de referencia.
const { POR_ID } = __req("nucleo/catalogo.js");
const { crearAzar, mezclar } = __req("nucleo/azar.js");
const { tipo } = __req("nucleo/tipos.js");
const SCHEMA_VERSION = 1;
const COLORES = ["amarillo", "rosa", "azul", "verde"];

function modelo(id) {
  const m = POR_ID[id];
  if (!m) throw new Error(`Modelo desconocido: «${id}»`);
  return m;
}

/** Parámetros por defecto: { rango, opción: valor, … }. */
function porDefecto(id) {
  const m = modelo(id), p = {};
  for (const o of m.opciones) p[o.id] = o.defecto ?? null;
  p.rango = m.rango;
  return p;
}

/** Comprueba y completa los parámetros. Devuelve un objeto nuevo o lanza Error. */
function validar(id, params = {}, tamano = "completa") {
  const m = modelo(id), p = { ...porDefecto(id), ...params };
  if (!m.tamanos.includes(tamano)) throw new Error(`${id}: no admite el tamaño '${tamano}'`);
  const ops = Object.fromEntries(m.opciones.map((o) => [o.id, o]));
  for (const [k, v] of Object.entries(p)) {
    if (k === "rango") {
      if (m.rangos.length && !m.rangos.includes(v)) throw new Error(`${id}: rango ${v} no admitido [${m.rangos}]`);
      continue;
    }
    const o = ops[k];
    if (!o) throw new Error(`${id}: opción desconocida '${k}'`);
    if (o.tipo === "opcion") {
      const x = o.valores.find((x) => x.valor === v);
      if (!x) throw new Error(`${id}: valor '${v}' no válido para ${k}`);
      if (x.tamanos && !x.tamanos.includes(tamano)) throw new Error(`${id}: '${x.etiqueta}' solo en ${x.tamanos}`);
    }
    if (o.tipo === "numero" && v !== null && !(Number.isInteger(v) && o.min <= v && v <= o.max))
      throw new Error(`${id}: ${k}=${v} fuera de ${o.min}–${o.max}`);
    if (o.tipo === "si_no" && typeof v !== "boolean") throw new Error(`${id}: ${k} debe ser sí/no`);
  }
  return p;
}

/** "SUMAS HASTA 20" → "Sumas hasta 20" (como _titulo() del motor). */
function capitalizar(t) {
  const s = t.toLowerCase().replace(" d y u", " D y U");
  const k = s.search(/\p{L}/u);
  return k < 0 ? s : s.slice(0, k) + s[k].toUpperCase() + s.slice(k + 1);
}

function tituloModelo(m, p = {}) {
  const t = m.titulo;
  return typeof t === "string" ? t : t[p.modo ?? "_"] ?? t._;
}

/** Título por defecto: el del modelo; con dos, «X y y». */
function tituloPagina(acts) {
  const ts = acts.map((a) => capitalizar(tituloModelo(modelo(a.tipo), a.params)));
  if (ts.length === 1 || ts[0] === ts[1]) return ts[0];
  return ts[0] + " y " + ts[1][0].toLowerCase() + ts[1].slice(1);
}

/** Colores de los paneles: el de la familia; si dos coinciden (sin elegirlos), el segundo pasa al siguiente. */
function coloresPagina(acts) {
  const usados = [];
  return acts.map((a) => {
    let k = a.color || modelo(a.tipo).color;
    if (usados.includes(k) && !a.color) {
      const i = COLORES.indexOf(k);
      k = [...COLORES.slice(i + 1), ...COLORES].find((x) => !usados.includes(x));
    }
    if (!COLORES.includes(k)) throw new Error(`Color no válido: «${k}»`);
    usados.push(k);
    return k;
  });
}

function pagina(acts, tamano, colores, semilla) {
  return {
    actividades: acts.map((a, i) => {
      const T = tipo(a.tipo);
      const res = T.generar(a.params, crearAzar(mezclar(semilla, i + 1)), { tamano });
      const n = i + 1;
      return {
        n, tipo: a.tipo, tipoVersion: T.version, params: a.params, tamano, color: colores[i],
        enunciado: res.enunciado, ejemplo: res.ejemplo ?? null,
        ejercicios: res.ejercicios.map((e, k) => ({ id: `a${n}e${k + 1}`, datos: e.datos, solucion: e.solucion, ...(e.pasos ? { pasos: e.pasos } : {}) })),
      };
    }),
  };
}

/**
 * opciones = {
 *   actividades: [{ tipo: "sumar.h20", params?: {…}, color?: "azul" }, …]   (1 o 2),
 *   titulo?, variantes?: 1 (N = variantes A, B, C…), presentacion?: { color, lecturaFacil, pictogramas },
 *   metadatos?: { dificultad, minutos, etiquetas }
 * }
 * Determinista: no pone id, creada ni autor (se añaden al guardar en Firestore).
 */
function generar(opciones, semilla = 1) {
  const brutas = opciones?.actividades || [];
  if (brutas.length < 1 || brutas.length > 2) throw new Error("Una ficha lleva 1 o 2 actividades.");
  if (!Number.isInteger(semilla)) throw new Error("La semilla debe ser un entero.");
  const tamano = brutas.length === 1 ? "completa" : "media";
  const acts = brutas.map((a) => {
    const m = modelo(a.tipo);
    if (!m.tamanos.includes(tamano)) throw new Error(`«${m.nombre}» solo cabe en una página completa.`);
    if (!tipo(a.tipo)) throw new Error(`«${m.nombre}» aún no está disponible en la app.`);
