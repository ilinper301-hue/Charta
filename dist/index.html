<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1B4D3E">
<title>Charta</title>
<style>
:root {
  --primario: #1B4D3E; --primario-osc: #133A2E; --fondo: #F4F7F5; --superficie: #FFFFFF;
  --suave: #E3EEE8; --texto: #1E2622; --texto-2: #5B6B63; --error: #A12A2A;
}
* { box-sizing: border-box; }
body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--fondo); color: var(--texto); }
.barra { background: var(--primario); color: #fff; padding: 14px 18px; display: flex; align-items: baseline; gap: 10px; }
.barra h1 { margin: 0; font-size: 1.35rem; letter-spacing: .02em; }
.sub { opacity: .8; font-size: .9rem; }
main { max-width: 760px; margin: 0 auto; padding: 14px; display: grid; gap: 14px; }
.tarjeta { background: var(--superficie); border: 1px solid var(--suave); border-radius: 12px; padding: 14px; display: grid; gap: 10px; }
label { display: grid; gap: 4px; font-size: .9rem; color: var(--texto-2); }
select, input { font: inherit; padding: 9px 10px; border: 1px solid #cfdcd5; border-radius: 8px; background: #fff; color: var(--texto); }
.botones { display: flex; gap: 8px; flex-wrap: wrap; }
button { font: inherit; padding: 10px 16px; border-radius: 8px; border: 1px solid var(--primario); background: #fff; color: var(--primario); cursor: pointer; }
button.primario { background: var(--primario); color: #fff; }
button:active { background: var(--primario-osc); color: #fff; }
h2 { margin: 0; font-size: 1.1rem; color: var(--primario); }
.soluciones { margin: 0; padding-left: 1.6em; columns: 3; font-variant-numeric: tabular-nums; }
.error { color: var(--error); margin: 0; }
pre { overflow: auto; max-height: 50vh; font-size: .75rem; background: var(--fondo); padding: 8px; border-radius: 8px; }
</style>
</head>
<body>
<header class="barra"><h1>Charta</h1><span class="sub">Fichas educativas</span></header>
<main>
  <section class="tarjeta">
    <label>Modelo <select id="modelo"></select></label>
    <div id="opciones"></div>
    <label>Semilla <input id="semilla" type="number" value="1" min="1"></label>
    <div class="botones">
      <button id="generar" class="primario">Generar</button>
      <button id="variante">Otra variante</button>
    </div>
    <p id="error" class="error" hidden></p>
  </section>
  <section class="tarjeta">
    <h2 id="titulo">—</h2>
    <ol id="soluciones" class="soluciones"></ol>
    <details><summary>JSON de la ficha</summary><pre id="json"></pre></details>
  </section>
</main>

"use strict";
const __mods = {
"app.js": (__exp) => {
// Charta · app (corte vertical de la fase 2). La interfaz completa llega en la fase 4.
const { CATALOGO } = __req("nucleo/catalogo.js");
const { generar, porDefecto, modelo } = __req("nucleo/ficha.js");
const { erroresFicha } = __req("nucleo/lector.js");
const { listaTipos } = __req("tipos/index.js");
globalThis.Charta = { generar, erroresFicha, listaTipos, CATALOGO };

function iniciar() {
  const $ = (id) => document.getElementById(id);
  const selModelo = $("modelo"), divOps = $("opciones"), inSemilla = $("semilla");

  for (const id of listaTipos()) selModelo.add(new Option(modelo(id).nombre, id));

  function pintarOpciones() {
    const m = modelo(selModelo.value), def = porDefecto(m.id);
    divOps.replaceChildren();
    const campo = (etq, control) => { const l = document.createElement("label"); l.append(etq, control); divOps.append(l); };
    if (m.rangos.length > 1) {
      const s = document.createElement("select"); s.dataset.op = "rango";
      for (const r of m.rangos) s.add(new Option(`Hasta el ${r}`, r, false, r === def.rango));
      campo("Rango", s);
    }
    for (const o of m.opciones) {
      let c;
      if (o.tipo === "opcion") {
        c = document.createElement("select");
        o.valores.forEach((v, i) => c.add(new Option(v.etiqueta, i, false, v.valor === def[o.id])));
      } else {
        c = document.createElement("input");
        c.type = o.tipo === "si_no" ? "checkbox" : "number";
        if (o.tipo === "si_no") c.checked = !!def[o.id]; else { c.min = o.min; c.max = o.max; c.value = def[o.id] ?? ""; }
      }
      c.dataset.op = o.id; campo(o.etiqueta, c);
    }
  }

  function leerParams() {
    const m = modelo(selModelo.value), p = {};
    for (const c of divOps.querySelectorAll("[data-op]")) {
      const k = c.dataset.op, o = m.opciones.find((x) => x.id === k);
      if (k === "rango") p.rango = +c.value;
      else if (o.tipo === "opcion") p[k] = o.valores[+c.value].valor;
      else if (o.tipo === "si_no") p[k] = c.checked;
      else p[k] = c.value === "" ? null : +c.value;
    }
    return p;
  }

  function pintar() {
    $("error").hidden = true;
    try {
      const f = generar({ actividades: [{ tipo: selModelo.value, params: leerParams() }] }, +inSemilla.value || 1);
      $("titulo").textContent = f.titulo;
      $("soluciones").replaceChildren(...f.paginas[0].actividades[0].ejercicios.map((e) => {
        const li = document.createElement("li");
        li.textContent = `${e.datos.a} ${e.datos.op} ${e.datos.b} = ${e.solucion.huecos.join(", ")}`;
        return li;
      }));
      $("json").textContent = JSON.stringify(f, null, 1);
    } catch (e) { $("error").textContent = e.message; $("error").hidden = false; }
  }

  selModelo.onchange = () => { pintarOpciones(); pintar(); };
  divOps.onchange = pintar;
  $("generar").onclick = pintar;
  $("variante").onclick = () => { inSemilla.value = (+inSemilla.value || 1) + 1; pintar(); };
  pintarOpciones(); pintar();
}

if (typeof document !== "undefined") iniciar();

Object.defineProperties(__exp, Object.getOwnPropertyDescriptors({  }));
},
"nucleo/azar.js": (__exp) => {
// Charta · azar con semilla (mulberry32). Mismas opciones + misma semilla = misma ficha.

/** Generador mulberry32: devuelve una función que da reales en [0, 1). */
function mulberry32(semilla) {
  let a = semilla >>> 0;
  return function () {
    a = (a + 0x6D2B79F5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

/** Mezcla varios enteros en una semilla de 32 bits (para semillas derivadas: variante, actividad…). */
function mezclar(...ns) {
  let h = 0x811C9DC5;
  for (const n of ns) {
    h = Math.imul(h ^ (n >>> 0), 0x01000193) >>> 0;
    h = Math.imul(h ^ (h >>> 13), 0x5BD1E995) >>> 0;
    h ^= h >>> 15;
  }
  return h >>> 0;
}

/** Objeto de azar con utilidades. Todas son deterministas a partir de la semilla. */
function crearAzar(semilla) {
  const r = mulberry32(semilla);
  const azar = {
    semilla: semilla >>> 0,
    real: r,
    /** Entero entre a y b, ambos incluidos. */
    entero(a, b) { return a + Math.floor(r() * (b - a + 1)); },
    elegir(lista) {
      if (!lista.length) throw new Error("elegir(): lista vacía");
      return lista[Math.floor(r() * lista.length)];
    },
    /** Copia barajada (Fisher–Yates). */
    barajar(lista) {
      const l = lista.slice();
      for (let i = l.length - 1; i > 0; i--) {
        const j = Math.floor(r() * (i + 1));
        [l[i], l[j]] = [l[j], l[i]];
      }
      return l;
    },
    /** k elementos distintos de la lista. */
    muestra(lista, k) { return azar.barajar(lista).slice(0, k); },
    /** Azar hijo independiente (p. ej. uno por actividad). */
    hijo(...claves) { return crearAzar(mezclar(azar.semilla, ...claves)); },
  };
  return azar;
}

Object.defineProperties(__exp, Object.getOwnPropertyDescriptors({ get mulberry32() { return mulberry32; }, get mezclar() { return mezclar; }, get crearAzar() { return crearAzar; } }));
},
